<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="لوحة ASTRA لتوصيل الطلبات المسندة للمندوب." />
    <title>ASTRA | لوحة المندوب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="courier.css" />
    <link rel="stylesheet" href="courier-theme.css?v=market-theme-1" />
  </head>
  <body>
    <header class="courier-header"><a class="courier-brand" href="/store"><span><i data-lucide="orbit"></i></span> ASTRA <small>DELIVERY</small></a><div class="courier-account"><span id="courierName"></span><button class="icon-button hidden" id="courierLogout" type="button" aria-label="تسجيل الخروج" title="تسجيل الخروج"><i data-lucide="log-out"></i></button></div></header>
    <main class="courier-main">
      <section class="courier-login" id="courierLoginView"><div class="login-intro"><span class="eyebrow">ASTRA DELIVERY</span><h1>دخول المندوب</h1><p>تابع طلبات التوصيل المسندة لحسابك فقط.</p></div><form id="courierLoginForm"><label>رقم الهاتف<input name="phone" type="tel" required autocomplete="tel" /></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" /></label><p id="courierLoginError" role="alert"></p><button class="button button-primary" type="submit">دخول لوحة التوصيل <i data-lucide="arrow-left"></i></button></form></section>
      <section class="hidden" id="courierDashboard"><div class="courier-page-heading"><div><span class="eyebrow">مساحة التوصيل</span><h1>طلبات التوصيل</h1><p>حدّث حالة طلبك بعد كل خطوة، وأكد التسليم برمز العميل.</p></div><button class="button button-outline" id="courierRefresh" type="button" aria-label="تحديث الطلبات" title="تحديث الطلبات"><i data-lucide="refresh-cw"></i></button></div><div class="courier-stats" id="courierStats"></div><div class="courier-orders" id="courierOrders"></div></section>
    </main>
    <div class="modal-backdrop hidden" id="failureModal"><section class="failure-dialog" role="dialog" aria-modal="true" aria-labelledby="failureTitle"><button class="icon-button close-failure" type="button" data-close-failure aria-label="إغلاق"><i data-lucide="x"></i></button><span class="eyebrow">تعذر التسليم</span><h2 id="failureTitle">اختار سببًا</h2><form id="failureForm"><input type="hidden" name="orderId" /><label class="reason-option"><input type="radio" name="reason" value="العميل غير متاح" required /> العميل غير متاح</label><label class="reason-option"><input type="radio" name="reason" value="العنوان غير صحيح" /> العنوان غير صحيح</label><label class="reason-option"><input type="radio" name="reason" value="العميل رفض الاستلام" /> العميل رفض الاستلام</label><label class="reason-option"><input type="radio" name="reason" value="سبب آخر" /> سبب آخر</label><textarea name="detail" maxlength="250" rows="2" placeholder="تفاصيل إضافية"></textarea><button class="button button-danger" type="submit">إرسال سبب التعذر</button></form></section></div>
    <div class="toast" id="courierToast" role="status" aria-live="polite"></div>
    <script src="courier.js?v=market-theme-1"></script>
  </body>
</html>
